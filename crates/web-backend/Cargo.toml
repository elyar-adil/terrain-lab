[package]
name = "web-backend"
version = "0.1.0"
edition = "2024"
description = "The application backend as a WebAssembly module for the browser build"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
app-backend = { path = "../app-backend" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terrain-core = { path = "../terrain-core" }
