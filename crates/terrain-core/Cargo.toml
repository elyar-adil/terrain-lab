[package]
name = "terrain-core"
version = "0.1.0"
edition = "2024"
autoexamples = false

[lints]
workspace = true

[[example]]
name = "terrain_generate"
path = "examples/generate.rs"

[[example]]
name = "render_fixture"
path = "examples/render_fixture.rs"

[[example]]
name = "erosion_probe"
path = "examples/erosion_probe.rs"

[[example]]
name = "analyze_frames"
path = "examples/analyze_frames.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
urban = { path = "../urban" }
city-scene = { path = "../city-scene" }
base64 = "0.22"
serde_json = "1"
