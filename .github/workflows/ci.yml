name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Tauri shell needs GTK/WebKit system libraries and is checked on the
      # desktop target; every library crate is pure Rust and checked here.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude wind-water-terrain-lab --all-targets -- -D warnings
      - run: cargo test --workspace --exclude wind-water-terrain-lab

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
