[package]
name = "wind-water-terrain-lab"
version = "0.1.0"
description = "风与水 · 无限地貌实验室"
authors = ["Wind & Water Lab"]
edition = "2024"

[lib]
name = "wind_water_terrain_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
infrastructure = { path = "../crates/infrastructure" }
procedural = { path = "../crates/procedural" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
terrain-core = { path = "../crates/terrain-core" }
city-scene = { path = "../crates/city-scene" }
urban = { path = "../crates/urban" }
